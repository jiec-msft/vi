name: Recording cue checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - app/audio-feedback.js
      - app/renderer.js
      - test/framework/feedback.test.cjs
      - scripts/cues-*
      - .github/workflows/cues-recovery.yml
permissions:
  contents: read
concurrency:
  group: cues-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Cue unit (${{ matrix.platform.os }}, ${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-2025, arch: x64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-15, arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cue lifecycle regressions
        run: node --test test/framework/feedback.test.cjs
