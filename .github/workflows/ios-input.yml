name: iOS input lifecycle
on:
  push:
    branches: [feat/ios-input-poc]
    paths:
      - prototypes/ios-input/**
      - .github/workflows/ios-input.yml
  pull_request:
    paths:
      - prototypes/ios-input/**
      - .github/workflows/ios-input.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-input-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  lifecycle:
    name: Swift lifecycle and unsigned simulator SDK compile
    runs-on: macos-15
    timeout-minutes: 3
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      IOS_INPUT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record actual environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$IOS_INPUT_HEAD"
          mkdir -p "$RUNNER_TEMP/ios-input-evidence"
          {
            printf 'head=%s\nevent_sha=%s\nrun=%s\nattempt=%s\n' \
              "$IOS_INPUT_HEAD" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'image=%s\nimage_version=%s\n' "$ImageOS" "$ImageVersion"
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun --sdk iphonesimulator --show-sdk-version
            printf 'runtime_exercised=none; SDK compilation only\n'
            printf 'input=synthetic text callbacks; no audio, network, TCC, keyboard or GUI\n'
          } | tee "$RUNNER_TEMP/ios-input-evidence/environment.txt"
      - name: Unit tests on macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path prototypes/ios-input \
            --scratch-path "$RUNNER_TEMP/ios-input-build" \
            -Xswiftc -warnings-as-errors 2>&1 \
            | tee "$RUNNER_TEMP/ios-input-evidence/unit.txt"
      - name: Compile library against iOS 18.5 and 26.2 simulator SDKs
        shell: bash
        run: |
          set -euo pipefail
          for entry in "16.4:18.5" "26.3:26.2"; do
            xcode="${entry%%:*}"
            expected_sdk="${entry#*:}"
            export DEVELOPER_DIR="/Applications/Xcode_${xcode}.app/Contents/Developer"
            test "$(xcrun --sdk iphonesimulator --show-sdk-version)" = "$expected_sdk"
            {
              xcodebuild -version
              xcrun swift --version
              xcrun --sdk iphonesimulator --show-sdk-version
              xcrun --sdk iphonesimulator --show-sdk-build-version
              xcrun --sdk iphonesimulator swiftc -swift-version 6 -warnings-as-errors \
                -parse-as-library -emit-module -module-name IOSInputSession \
                -target arm64-apple-ios17.0-simulator \
                -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
                prototypes/ios-input/Sources/IOSInputSession/InputSession.swift \
                -o "$RUNNER_TEMP/IOSInputSession-${expected_sdk}.swiftmodule"
              printf 'unsigned_sdk_compile=%s; runtime_exercised=none\n' "$expected_sdk"
            } 2>&1 | tee "$RUNNER_TEMP/ios-input-evidence/sdk-${expected_sdk}.txt"
          done
      - name: Save text-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-input-lifecycle-receipt
          path: ${{ runner.temp }}/ios-input-evidence/*.txt
          retention-days: 3
          if-no-files-found: error
